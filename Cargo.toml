[package]
name = "vynkor-sdk"
version = "0.0.4"
edition = "2021"
rust-version = "1.85"
description = "Rust SDK for writing Vynkor plugins — async IPC client (UDS + WebSocket), Plugin trait, and full Vynkor wire protocol (framing, zstd compression, HMAC frame MACs, fragmentation, raw audio)."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/vynkor-core/vynkor-sdk"
documentation = "https://docs.rs/vynkor-sdk"
keywords = ["vynkor", "plugin", "ipc", "sdk", "kernel"]
categories = ["api-bindings", "asynchronous"]

[dependencies]
vynkor-wire = "0.0.4"
tokio = { version = "1", features = ["net", "io-util", "time", "rt", "macros", "sync"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
prost = "0.13"
crc32fast = "1"
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
